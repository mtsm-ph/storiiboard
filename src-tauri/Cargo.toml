[package]
name = "storiiboard"
version = "0.1.0"
description = "Open-source pre-production for filmmakers"
authors = ["Kevin Matos"]
edition = "2021"
rust-version = "1.85"

[lib]
# The _lib suffix avoids a Windows name clash between the lib and the bin.
name = "storiiboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled compiles SQLite in, so every install has the same version whatever the OS ships.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Native Save and Open dialogs for New project, Open and Open backup (0.7, approved Nov 2).
tauri-plugin-dialog = "2.8.3"
# The one HTTP client for every network need (3.4, approved Nov 9: the address search now; weather, map tiles,
# cloud downloads and the updater later), through src/net.rs only. reqwest is already in the build through Tauri;
# this adds TLS the way Tauri's updater plugin does (rustls with ring as its crypto, the OS's own certificate store
# through rustls-platform-verifier), so the app has one network stack and no OpenSSL. Both pinned exactly, each released
# at least two weeks before it was added (reqwest Sep 8, rustls Oct 14, 2026; MIT, Apache or ISC).
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
# Opening a web link in the browser and a PDF attachment's copy in the PDF reader (3.12, approved Nov 9), from Rust only
# (src/open.rs): the page has no opener permission. Pinned exactly (MIT or Apache; released Oct 14, 2026).
tauri-plugin-opener = "=2.7.2"

# Desktop only: a second launch (a double-click on a .sbd while the app runs, on Windows) hands its arguments to the
# running app and exits, so one window owns the open project (src/opened.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.4"

# macOS only: reading the attribute File Provider sync services put on their folders (src/synced.rs). Already in the
# build through Tauri; approved as a direct dependency Nov 2.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

# Windows only: a drive's free space, and a Job Object so ffmpeg stops with the app, crash or not (D2). Already in the
# build through Tauri, at this version; approved as a direct dependency Nov 5.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  # The regional first day of the week (3.17, region.rs).
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
