name: CI

# Quick checks on Linux for every pull request (Kevin, Nov 4): lint, types, unit tests and the Rust tests, the Rust
# data-safety tests among them. A push to v2 runs them once more on the merged result. The end-to-end smoke set and
# the installers run at a checkpoint instead (checkpoint.yml), and the deeper end-to-end specs run locally before each
# merge (`npm run e2e`). Changes to docs alone skip CI.
on:
  push:
    branches: [v2]
    paths-ignore: ['docs/**', '*.md', '*.pdf']
  pull_request:
    paths-ignore: ['docs/**', '*.md', '*.pdf']
  workflow_dispatch:

concurrency:
  # A newer push to a pull request cancels the run its last push started.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install the system libraries the tauri crate links against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      # tsc, eslint, cargo fmt and clippy.
      - run: npm run lint
      # Vitest, then cargo test.
      - run: npm test
