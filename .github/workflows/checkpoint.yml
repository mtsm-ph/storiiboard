name: Checkpoint

# Run by hand at a checkpoint (Kevin, Nov 4): the end-to-end smoke set (e2e/smoke.spec.ts) on Linux in Chromium and
# WebKit, the whole end-to-end suite in WebKit on a Mac (Kevin, Nov 14: the closest stand-in for the Mac app's
# webview, and until then no test had run Phase 5's or 6's canvas in the Mac's engine), and the Mac and Windows
# installers, each after its own Rust tests: clones and private sizes exist only on a Mac, and on Windows the
# step-by-step copy is the only backup path, so Linux alone never runs them.
# A workflow_dispatch run needs the file on the default branch, which is still main, so pushing a branch named
# checkpoint/<anything> (git push origin v2:checkpoint/phase1) starts one too. A branch named checkpoint/baselines-<anything>
# regenerates the screenshot baselines instead, as the update_visual_baselines option does, for the same reason.
# A branch named checkpoint/e2e-<anything> runs the tests without the installers: for a fix to a test that failed
# only on the Mac, which needs the Mac's run again but not an hour of builds.
on:
  push:
    branches: ['checkpoint/**']
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Regenerate the Linux and macOS visual baselines and upload them as artifacts to commit
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-linux:
    name: Smoke (Linux)
    # Pinned rather than -latest: the visual baselines depend on the image's font rendering.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright's browsers
        run: npx playwright install --with-deps chromium webkit
      # The screenshot tests (on again from polish 8) run beside the smoke set at every checkpoint.
      - name: Smoke and screenshot tests
        if: ${{ !(inputs.update_visual_baselines || startsWith(github.ref_name, 'checkpoint/baselines')) }}
        run: npx playwright test e2e/smoke.spec.ts e2e/visual.spec.ts
      - name: Regenerate the Linux visual baselines
        if: ${{ (inputs.update_visual_baselines || startsWith(github.ref_name, 'checkpoint/baselines')) }}
        run: npx playwright test e2e/visual.spec.ts --update-snapshots=all
      # Baselines come back as an artifact to commit rather than being committed here: a commit pushed with the
      # workflow's own token starts no CI run, so the new baselines would go unchecked. The artifact holds the PNGs
      # without their folder: they go back into e2e/visual.spec.ts-snapshots.
      - name: Look for new or changed Linux baselines
        id: baselines
        if: ${{ !cancelled() && (inputs.update_visual_baselines || startsWith(github.ref_name, 'checkpoint/baselines')) }}
        run: echo "count=$(git status --porcelain --untracked-files=all -- 'e2e/*-snapshots/*-linux.png' | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Upload the Linux baselines to commit
        if: ${{ !cancelled() && (inputs.update_visual_baselines || startsWith(github.ref_name, 'checkpoint/baselines')) && steps.baselines.outputs.count != '0' }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-linux
          path: e2e/*-snapshots/*-linux.png
          retention-days: 7
      # Every failed and flaky test by name (3.19, Kevin Nov 9): a flaky one passed on its retry, so the job stays green;
      # listed in the log, and Playwright's report kept as an artifact either way.
      - name: List the failed and flaky Linux tests
        if: ${{ !cancelled() && hashFiles('test-results/e2e.json') != '' }}
        run: npm run failed-tests -- test-results/e2e.json
      - name: Keep the Linux end-to-end report
        if: ${{ !cancelled() && hashFiles('test-results/e2e.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-report-linux
          path: test-results/e2e.json
          retention-days: 14
      - name: Upload the Playwright results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-linux
          path: test-results/
          retention-days: 7

  # The whole suite in Chromium (Kevin, Nov 17), the engine of the Windows app's WebView2, which no other job runs
  # whole; until now only the local run on the Windows PC did. One worker per core (Kevin, Nov 18): at 8 on GitHub's
  # 4-core machine the canvas tests timed out. 100% follows the machine (4 cores public, 2 private); if timeouts still
  # show, drop to the default rather than raise a timeout.
  e2e-chromium-linux:
    name: End to end (Linux, Chromium)
    if: ${{ !(inputs.update_visual_baselines || startsWith(github.ref_name, 'checkpoint/baselines')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright's browsers
        run: npx playwright install --with-deps chromium
      - name: The whole end-to-end suite in Chromium
        run: npx playwright test --project=chromium --workers=100% $(cat e2e/ONLY.txt 2>/dev/null | tr '\n' ' ')
      - name: List the failed and flaky Chromium tests
        if: ${{ !cancelled() && hashFiles('test-results/e2e.json') != '' }}
        run: npm run failed-tests -- test-results/e2e.json
      - name: Keep the Chromium end-to-end report
        if: ${{ !cancelled() && hashFiles('test-results/e2e.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-report-linux-chromium
          path: test-results/e2e.json
          retention-days: 14
      - name: Upload the Playwright results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-linux-chromium
          path: test-results/
          retention-days: 7

  smoke-mac:
    name: End to end (macOS, WebKit)
    # Pinned like the Linux job: the darwin baselines come from this image (macOS 26), and WebKit and font rendering
    # change between macOS versions. A Mac on another major version may need its own run of the screenshot tests.
    runs-on: macos-26
    # The whole suite (Kevin, Nov 14), smoke and screenshots included; the report says how long it took.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium too when regenerating: the Mac's local gate runs both browsers, so both need darwin baselines.
      - name: Install Playwright's browsers
        run: npx playwright install webkit ${{ (inputs.update_visual_baselines || startsWith(github.ref_name, 'checkpoint/baselines')) && 'chromium' || '' }}
      # Safari's engine on a Mac moves Tab only between text fields and lists unless the system's "Keyboard
      # navigation" is on; the Mac app's own webview turns that on for itself (wry sets tabFocusesLinks), so the
      # tests' WebKit is given the same here. Without it, 14 keyboard tests failed on the first whole-suite run.
      - name: Tab reaches every control, as in the Mac app
        run: defaults write -g AppleKeyboardUIMode -int 2
      # A checkpoint/e2e-<name> branch may carry e2e/ONLY.txt (never merged): the specs to run, one per line, for a
      # second look at tests that failed only here. Without the file, the whole suite.
      - name: The whole end-to-end suite in WebKit
        if: ${{ !(inputs.update_visual_baselines || startsWith(github.ref_name, 'checkpoint/baselines')) }}
        run: npx playwright test --project=webkit $(cat e2e/ONLY.txt 2>/dev/null | tr '\n' ' ')
      - name: Regenerate the macOS visual baselines
        if: ${{ (inputs.update_visual_baselines || startsWith(github.ref_name, 'checkpoint/baselines')) }}
        run: npx playwright test e2e/visual.spec.ts --update-snapshots=all
      - name: Look for new or changed macOS baselines
        id: baselines
        if: ${{ !cancelled() && (inputs.update_visual_baselines || startsWith(github.ref_name, 'checkpoint/baselines')) }}
        run: echo "count=$(git status --porcelain --untracked-files=all -- 'e2e/*-snapshots/*-darwin.png' | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Upload the macOS baselines to commit
        if: ${{ !cancelled() && (inputs.update_visual_baselines || startsWith(github.ref_name, 'checkpoint/baselines')) && steps.baselines.outputs.count != '0' }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-macos
          path: e2e/*-snapshots/*-darwin.png
          retention-days: 7
      # Every failed and flaky test by name (3.19, Kevin Nov 9): a flaky one passed on its retry, so the job stays green;
      # listed in the log, and Playwright's report kept as an artifact either way.
      - name: List the failed and flaky macOS tests
        if: ${{ !cancelled() && hashFiles('test-results/e2e.json') != '' }}
        run: npm run failed-tests -- test-results/e2e.json
      - name: Keep the macOS end-to-end report
        if: ${{ !cancelled() && hashFiles('test-results/e2e.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-report-macos
          path: test-results/e2e.json
          retention-days: 14
      - name: Upload the Playwright results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-macos
          path: test-results/
          retention-days: 7

  # The Advisories job, the same as in ci.yml (Kevin, Nov 18): red for a known vulnerability or malware in what
  # Storiiboard ships, and only for that; scripts/advisories.ts decides, osv-scanner.toml holds the ignores.
  advisories:
    name: Advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # No install scripts: a malicious postinstall mustn't run before this job reports it, and nothing here needs them.
      - run: npm ci --ignore-scripts
      # For cargo tree alone: it reads the crates' manifests and builds nothing, so no system library or sidecar.
      - uses: dtolnay/rust-toolchain@stable
      # From its GitHub release, never through npx or a package manager, and checked before it runs.
      - name: Fetch OSV-Scanner v2.7.0 and check it
        env:
          OSV_URL: https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          mkdir -p "$RUNNER_TEMP/osv"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/osv/osv-scanner" "$OSV_URL"
          echo "$OSV_SHA256  $RUNNER_TEMP/osv/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv/osv-scanner"
      # An empty config, so OSV-Scanner reports everything and osv-scanner.toml's ignores are applied once, by the
      # script, the same way for npm audit's findings. Its exit code doesn't decide: 1 only says it found something;
      # above 1 it failed, and the script must not read what it left.
      - name: OSV-Scanner on both lock files
        run: |
          mkdir -p test-results/advisories
          : > "$RUNNER_TEMP/osv/no-ignores.toml"
          status=0
          "$RUNNER_TEMP/osv/osv-scanner" scan source --config "$RUNNER_TEMP/osv/no-ignores.toml" --format json \
            --lockfile package-lock.json --lockfile src-tauri/Cargo.lock > test-results/advisories/osv.json || status=$?
          if [ "$status" -gt 1 ]; then echo "OSV-Scanner failed with exit code $status"; exit 1; fi
      # Its exit code doesn't decide either; a failed audit writes an error the script refuses.
      - name: npm audit
        run: npm audit --json > test-results/advisories/npm-audit.json || true
      # Normal dependencies only, proc macros left out: build scripts' crates and proc macros run only as the app is
      # compiled, so neither is in what ships.
      - name: The app's crates on Windows and on the Mac
        run: |
          cargo tree --manifest-path src-tauri/Cargo.toml --locked -e normal,no-proc-macro --target x86_64-pc-windows-msvc > test-results/advisories/tree-windows.txt
          cargo tree --manifest-path src-tauri/Cargo.toml --locked -e normal,no-proc-macro --target aarch64-apple-darwin > test-results/advisories/tree-mac.txt
      # One line per finding in the log, every finding in the step summary; exits 1 only when one is red.
      - name: Classify every finding
        run: >-
          node scripts/advisories.ts --osv test-results/advisories/osv.json --npm test-results/advisories/npm-audit.json
          --tree-windows test-results/advisories/tree-windows.txt --tree-mac test-results/advisories/tree-mac.txt
      - name: Keep what the job read
        if: ${{ !cancelled() && hashFiles('test-results/advisories/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: advisories-report
          path: test-results/advisories/
          retention-days: 14

  # The ffmpeg sidecars' sources, fetched once on Linux and handed to the Mac and Windows builds: a download site can
  # stop answering one runner's network for an hour (ffmpeg.org did, from Windows runners, Nov 6) while others reach it.
  sources:
    name: ffmpeg sources
    if: ${{ !(inputs.update_visual_baselines || startsWith(github.ref_name, 'checkpoint/baselines') || startsWith(github.ref_name, 'checkpoint/e2e-')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Kept in a cache any runner can read (enableCrossOsArchive), by the pins' own hash.
      - name: Restore the sources
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ffmpeg-sources
          key: ffmpeg-sources-${{ hashFiles('scripts/ffmpeg/sources.sh') }}
          enableCrossOsArchive: true
      - name: Fetch and check the sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/ffmpeg/sources.sh ffmpeg-sources
      - name: Save the sources
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ffmpeg-sources
          key: ffmpeg-sources-${{ hashFiles('scripts/ffmpeg/sources.sh') }}
          enableCrossOsArchive: true

  installers:
    name: Installer (${{ matrix.name }})
    needs: sources
    if: ${{ !(inputs.update_visual_baselines || startsWith(github.ref_name, 'checkpoint/baselines') || startsWith(github.ref_name, 'checkpoint/e2e-')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same image the smoke job runs on: on Nov 6, macos-latest jobs sat 15 minutes without a runner and were
          # cancelled, twice, while macos-26 started at once.
          - name: macOS
            os: macos-26
            triple: aarch64-apple-darwin
            bundles: src-tauri/target/release/bundle/dmg/*.dmg
            app: src-tauri/target/release/bundle/macos/Storiiboard.app/Contents/MacOS/storiiboard
          - name: Windows
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
            app: src-tauri/target/release/storiiboard.exe
    runs-on: ${{ matrix.os }}
    # A cold ffmpeg build under MSYS2 takes a good part of an hour before the Rust tests and the release build.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      # The sources the job above fetched; the build still checks each against its checksum, and downloads any that
      # isn't there.
      - uses: actions/cache/restore@v4
        with:
          path: ffmpeg-sources
          key: ffmpeg-sources-${{ hashFiles('scripts/ffmpeg/sources.sh') }}
          enableCrossOsArchive: true
      # The LGPL ffmpeg and ffprobe sidecars (Phase 2.1), built from one pinned release and cached.
      - uses: ./.github/actions/ffmpeg
        env:
          SBD_FFMPEG_SOURCES: ffmpeg-sources
        with:
          triple: ${{ matrix.triple }}
      # Kept a week, so a developer's computer can use the same build (scripts/ffmpeg/README.md).
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.triple }}
          path: src-tauri/binaries
          retention-days: 7
      # What the runner's disk holds before the tests, and on a failure what's left running: copy tests that all stall
      # at once point at the runner (its disk or its encoder), not at one test.
      - name: Free space before the Rust tests
        shell: bash
        run: df -h . "${RUNNER_TEMP:-/tmp}" /tmp || true
      # A step of its own time, so a test run that hangs fails here and the step after it still says what was running.
      - name: Rust tests
        timeout-minutes: 40
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml
      - name: The runner after a failed test run
        if: failure()
        shell: bash
        run: |
          df -h . "${RUNNER_TEMP:-/tmp}" /tmp || true
          ps -A -o pid,stat,etime,command 2>/dev/null | grep -i -E 'ffmpeg|ffprobe|VTEncoder|storiiboard' | grep -v grep | head -40 || tasklist 2>/dev/null | grep -i -E 'ffmpeg|ffprobe|storiiboard' || true
      # With no tag or release given, tauri-action only builds. The Mac app gets an ad-hoc signature
      # (bundle.macOS.signingIdentity "-"), so Apple Silicon opens it with right-click, Open.
      - uses: tauri-apps/tauri-action@v1
        id: build
      # Double-clicking a .sbd opens Storiiboard (0.6). The association lives in what the bundler writes, so check
      # it there rather than trust the config.
      - name: Check the .sbd file association (macOS)
        if: matrix.name == 'macOS'
        run: |
          plist=src-tauri/target/release/bundle/macos/Storiiboard.app/Contents/Info.plist
          plutil -extract CFBundleDocumentTypes json -o - "$plist" | grep -q '"CFBundleTypeExtensions":\["sbd"\]'
          plutil -extract UTExportedTypeDeclarations json -o - "$plist" | grep -q '"UTTypeIdentifier":"app.storiiboard.project"'
      - name: Check the .sbd file association (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $found = Select-String -Path src-tauri/target/release/wix/*/main.wxs, src-tauri/target/release/nsis/*/installer.nsi -Pattern '\bsbd\b'
          if (-not $found) { throw 'Neither installer registers .sbd files.' }
          $found | ForEach-Object { "$($_.Path): $($_.Line.Trim())" }
      # Uploaded before the listing below, so a check there that is itself wrong never costs the installers.
      - uses: actions/upload-artifact@v7
        with:
          name: storiiboard-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 7
      # What the installer carries (the desktop gap audit, B4): a release build looks for ffmpeg and ffprobe only
      # beside the executable, and nothing else ever looked inside the bundle. The fonts themselves are in the page's
      # build (dist), which the executable embeds; their licences are bundle resources.
      - name: List the bundle and check what must be in it (macOS)
        if: matrix.name == 'macOS'
        run: |
          app=src-tauri/target/release/bundle/macos/Storiiboard.app/Contents
          ls -lR "$app/MacOS" "$app/Resources"
          for f in ffmpeg ffprobe; do
            test -x "$app/MacOS/$f" || { echo "Missing beside the executable: $f"; exit 1; }
          done
          for f in ffmpeg-LICENSE.txt ffmpeg-LICENSE.md zimg-LICENSE.txt dav1d-LICENSE.txt ffmpeg-SOURCE.txt \
                   fonts-archivo-OFL.txt fonts-bodonimoda-OFL.txt fonts-intertight-OFL.txt \
                   fonts-jetbrainsmono-OFL.txt fonts-jost-OFL.txt fonts-outfit-OFL.txt; do
            test -n "$(find "$app/Resources" -name "$f" -type f -size +0)" || { echo "Missing from Resources: $f"; exit 1; }
          done
          test "$(find dist -name '*.ttf' | wc -l)" -gt 0 || { echo 'No fonts in the page build.'; exit 1; }
      - name: List the bundle and check what must be in it (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $names = 'ffmpeg.exe', 'ffprobe.exe', 'ffmpeg-LICENSE.txt', 'ffmpeg-LICENSE.md', 'zimg-LICENSE.txt',
            'dav1d-LICENSE.txt', 'ffmpeg-SOURCE.txt', 'fonts-archivo-OFL.txt', 'fonts-bodonimoda-OFL.txt',
            'fonts-intertight-OFL.txt', 'fonts-jetbrainsmono-OFL.txt', 'fonts-jost-OFL.txt', 'fonts-outfit-OFL.txt'
          $scripts = @(Get-ChildItem src-tauri/target/release/wix/*/main.wxs) + @(Get-ChildItem src-tauri/target/release/nsis/*/installer.nsi)
          if ($scripts.Count -lt 2) { throw 'Expected the scripts of both installers.' }
          foreach ($script in $scripts) {
            Select-String -Path $script -Pattern 'ffmpeg|ffprobe|LICENSE|OFL|SOURCE' | ForEach-Object { "$($script.Name): $($_.Line.Trim())" }
            foreach ($name in $names) {
              if (-not (Select-String -Path $script -SimpleMatch $name -Quiet)) { throw "$($script.Name) doesn't carry $name" }
            }
          }
          if (-not (Get-ChildItem dist -Recurse -Filter *.ttf)) { throw 'No fonts in the page build.' }
      # The launch check (6.27l, docs/briefs/launch-check.md): starts the executable the installers carry in its
      # self-check mode, which makes the main window, loads the page under the installed policy, checks the policy is
      # enforced, starts both workers and reads each one's policy, then quits with 0. Last, after the upload and the
      # listing, so a fault in the check never costs the installers. It runs whenever the build succeeded, whatever the
      # steps between did.
      - name: Launch check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        timeout-minutes: 5
        run: bash scripts/launchCheck.sh "${{ matrix.app }}"
