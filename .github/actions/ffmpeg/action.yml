name: ffmpeg sidecars
description: >
  ffmpeg and ffprobe for Storiiboard's sidecars (Phase 2.1), built by scripts/ffmpeg/build.sh into src-tauri/binaries,
  cached by the script's and this file's contents.
inputs:
  triple:
    description: The Rust target triple the sidecars are named for (x86_64-unknown-linux-gnu, aarch64-apple-darwin, x86_64-pc-windows-msvc)
    required: true
runs:
  using: composite
  steps:
    # Restore and save are separate steps, so a fresh build is saved as soon as it succeeds: actions/cache's own save
    # runs only when the whole job passes, and a failing test later on would throw a 20-minute build away.
    # A cache made on a checkpoint/<name> branch is seen only by that branch (and main), so each new checkpoint name
    # builds the Mac and Windows sidecars once.
    - name: Restore the ffmpeg build
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: src-tauri/binaries
        key: ffmpeg-${{ inputs.triple }}-${{ hashFiles('scripts/ffmpeg/build.sh', '.github/actions/ffmpeg/action.yml') }}
    # Windows builds in MSYS2's MINGW64 shell, statically, so the .exe needs nothing beside it. zimg builds with
    # autotools, dav1d with meson and ninja (D1).
    - name: Set up MSYS2
      if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          make diffutils tar xz curl autoconf automake libtool
          mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib
          mingw-w64-x86_64-meson mingw-w64-x86_64-ninja
    - name: Build ffmpeg (Windows)
      if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: msys2 {0}
      run: scripts/ffmpeg/build.sh "${{ inputs.triple }}" src-tauri/binaries
    - name: Install the build tools (Linux)
      if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
      shell: bash
      run: sudo apt-get install -y nasm meson ninja-build autoconf automake libtool pkg-config
    # Homebrew keeps installed tools as they are; libtool comes as glibtoolize, which build.sh points autoreconf at.
    - name: Install the build tools (macOS)
      if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
      shell: bash
      run: brew install autoconf automake libtool meson ninja pkgconf
    - name: Build ffmpeg (macOS, Linux)
      if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
      shell: bash
      run: scripts/ffmpeg/build.sh "${{ inputs.triple }}" src-tauri/binaries
    - name: Save the ffmpeg build
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: src-tauri/binaries
        key: ${{ steps.cache.outputs.cache-primary-key }}
